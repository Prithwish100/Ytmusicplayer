openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: music
    description: Music search and playback
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /music/search:
    get:
      operationId: searchMusic
      tags: [music]
      summary: Search music tracks
      description: Searches music results and returns playable YouTube Music tracks.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Matching music tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MusicTrack"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Music search is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MusicTrack:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: ["integer", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        playbackUrl:
          type: string
        watchUrl:
          type: string
      required:
        - id
        - title
        - artist
        - durationSeconds
        - thumbnailUrl
        - playbackUrl
        - watchUrl
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

