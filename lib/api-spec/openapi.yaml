openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: music
    description: Music search and playback
  - name: favorites
    description: Account favorites
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /music/search:
    get:
      operationId: searchMusic
      tags: [music]
      summary: Search music tracks
      description: Searches music results and returns playable YouTube Music tracks.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Matching music tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MusicTrack"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Music search is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/favorites:
    get:
      operationId: listMyFavorites
      tags: [favorites]
      summary: List the signed-in user's favorites
      responses:
        "200":
          description: Saved favorite tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MusicTrack"
        "401":
          description: Sign in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/favorites/{id}:
    put:
      operationId: upsertMyFavorite
      tags: [favorites]
      summary: Save a track to the signed-in user's favorites
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{11}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteTrackInput"
      responses:
        "200":
          description: Saved favorite track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicTrack"
        "400":
          description: Invalid favorite track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMyFavorite
      tags: [favorites]
      summary: Remove a track from the signed-in user's favorites
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{11}$"
      responses:
        "204":
          description: Favorite removed
        "401":
          description: Sign in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MusicTrack:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: ["integer", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        playbackUrl:
          type: string
        watchUrl:
          type: string
      required:
        - id
        - title
        - artist
        - durationSeconds
        - thumbnailUrl
        - playbackUrl
        - watchUrl
    FavoriteTrackInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        artist:
          type: string
          minLength: 1
          maxLength: 500
        durationSeconds:
          type: ["integer", "null"]
          minimum: 0
        thumbnailUrl:
          type: ["string", "null"]
          maxLength: 2048
      required:
        - title
        - artist
        - durationSeconds
        - thumbnailUrl
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

